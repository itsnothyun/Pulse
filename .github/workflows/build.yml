name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish single-file exe
        run: >
          dotnet publish windows/Pulse/Pulse.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o out
      - name: Render snapshots (proves the UI draws on Windows)
        shell: pwsh
        run: |
          $p = Start-Process out/Pulse.exe -ArgumentList '--snapshot','snapshot-windows.png' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path snapshot-windows.png)) { throw "snapshot failed" }
          Start-Process out/Pulse.exe -ArgumentList '--snapshot','snapshot-windows-demo.png','--demo' -Wait
          Start-Process out/Pulse.exe -ArgumentList '--snapshot','snapshot-windows-compact.png','--demo','--compact' -Wait
          Start-Process out/Pulse.exe -ArgumentList '--snapshot','snapshot-windows-mini.png','--demo','--mini' -Wait
          if (-not (Test-Path snapshot-windows-mini.png)) { throw "mini snapshot failed" }
          Start-Process out/Pulse.exe -ArgumentList '--snapshot','snapshot-windows-top-cpu.png','--top','cpu' -Wait
          Start-Process out/Pulse.exe -ArgumentList '--snapshot','snapshot-windows-top-mem.png','--top','mem' -Wait
          if (-not (Test-Path snapshot-windows-top-mem.png)) { throw "top snapshot failed" }
          Compress-Archive -Path out/Pulse.exe -DestinationPath Pulse-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-windows-x64
          path: Pulse-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots-windows
          path: snapshot-windows*.png

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: UNIVERSAL=1 APP=$PWD/dist/Pulse.app VERSION=${GITHUB_REF_NAME#v} ./macos/build.sh
      - name: Render snapshot
        run: |
          dist/Pulse.app/Contents/MacOS/Pulse --snapshot snapshot-macos.png --demo
          dist/Pulse.app/Contents/MacOS/Pulse --snapshot snapshot-macos-mini.png --demo --mini
          dist/Pulse.app/Contents/MacOS/Pulse --snapshot snapshot-macos-top.png --top cpu
      - name: Zip
        run: ditto -c -k --keepParent dist/Pulse.app Pulse-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-macos-universal
          path: Pulse-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots-macos
          path: snapshot-macos*.png

  linux:
    runs-on: ubuntu-24.04-arm          # the DGX Spark is aarch64; the code is pure Python so x86-64 works too
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 python3-cairo xvfb
      - name: Unit tests
        run: python3 -m unittest discover -s linux/tests -v
      - name: Render snapshots (proves the UI draws on Linux)
        working-directory: linux
        run: |
          python3 -m pulse --snapshot ../snapshot-linux.png
          python3 -m pulse --snapshot ../snapshot-linux-demo.png --demo
          python3 -m pulse --snapshot ../snapshot-linux-compact.png --demo --compact
          python3 -m pulse --snapshot ../snapshot-linux-mini.png --demo --mini
          python3 -m pulse --snapshot ../snapshot-linux-top-cpu.png --top cpu
          python3 -m pulse --snapshot ../snapshot-linux-top-mem.png --top mem
      - name: GTK window smoke test (starts, draws for 4 s, exits cleanly)
        working-directory: linux
        run: |
          timeout -s TERM 4 xvfb-run -a python3 -m pulse || [ $? -eq 124 ]
      - name: Install script
        run: |
          ./linux/install.sh
          test -x ~/.local/bin/pulse && test -f ~/.local/share/applications/pulse.desktop
          ./linux/install.sh --uninstall
      - name: Package
        run: |
          mkdir -p stage/pulse-linux && cp -r linux/pulse linux/install.sh stage/pulse-linux/ && cp assets/icon-512.png stage/pulse-linux/icon.png
          find stage -name __pycache__ -prune -exec rm -rf {} +
          tar -C stage -czf Pulse-linux.tar.gz pulse-linux
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-linux
          path: Pulse-linux.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots-linux
          path: snapshot-linux*.png

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Pulse-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Pulse-windows-x64.zip
            Pulse-macos-universal.zip
            Pulse-linux.tar.gz
          generate_release_notes: true
