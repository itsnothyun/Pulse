# nginx server block for the Pulse marketing site.
# 1. rsync -a site/ user@your-vps:/var/www/pulse/
# 2. put this file in /etc/nginx/sites-available/pulse, set server_name, symlink to sites-enabled
# 3. sudo nginx -t && sudo systemctl reload nginx   (then: sudo certbot --nginx -d your.domain)

server {
    listen 80;
    listen [::]:80;
    server_name pulse.example.com;

    root /var/www/pulse;
    index index.html;

    charset utf-8;
    types { application/javascript js mjs; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # only external call: the GitHub API for the live star count
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; style-src 'self'; script-src 'self'; font-src 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # fonts and images never change in place
    location ~* \.(woff2|png|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }
}
